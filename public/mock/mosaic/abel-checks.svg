<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Indigo and white checked cloth"><defs>
<pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
  <rect width="3" height="3" fill="#000" fill-opacity=".07"/><rect x="3" y="3" width="3" height="3" fill="#000" fill-opacity=".07"/>
  <rect x="3" width="3" height="3" fill="#fff" fill-opacity=".05"/><rect y="3" width="3" height="3" fill="#fff" fill-opacity=".05"/>
</pattern>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
</linearGradient><pattern id="gv" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="48" height="96" fill="#2F3D6B" fill-opacity=".55"/><rect x="62" width="4" height="96" fill="#2F3D6B" fill-opacity=".7"/></pattern>
     <pattern id="gh" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="48" fill="#2F3D6B" fill-opacity=".55"/><rect y="62" width="96" height="4" fill="#2F3D6B" fill-opacity=".7"/></pattern></defs><rect width="1200" height="1500" fill="#EFE8DA"/><rect width="1200" height="1500" fill="url(#gv)"/><rect width="1200" height="1500" fill="url(#gh)"/><rect width="1200" height="1500" fill="url(#weave)"/><rect width="1200" height="1500" fill="url(#light)"/></svg>
