<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Brown and oat napkins in a nested-square weave"><defs>
<pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
  <rect width="3" height="3" fill="#000" fill-opacity=".07"/><rect x="3" y="3" width="3" height="3" fill="#000" fill-opacity=".07"/>
  <rect x="3" width="3" height="3" fill="#fff" fill-opacity=".05"/><rect y="3" width="3" height="3" fill="#fff" fill-opacity=".05"/>
</pattern>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
</linearGradient><pattern id="ks" width="140" height="140" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="140" height="140" fill="#6E5D4C"/><rect x="14" y="14" width="112" height="112" fill="#DCCFB8"/><rect x="28" y="28" width="84" height="84" fill="#6E5D4C"/><rect x="42" y="42" width="56" height="56" fill="#DCCFB8"/><rect x="56" y="56" width="28" height="28" fill="#6E5D4C"/></pattern></defs><rect width="1200" height="1200" fill="url(#ks)"/><rect width="1200" height="1200" fill="url(#weave)"/><rect width="1200" height="1200" fill="url(#light)"/></svg>
