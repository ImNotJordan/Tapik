<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Indigo and white binakol weave"><defs>
<pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
  <rect width="3" height="3" fill="#000" fill-opacity=".07"/><rect x="3" y="3" width="3" height="3" fill="#000" fill-opacity=".07"/>
  <rect x="3" width="3" height="3" fill="#fff" fill-opacity=".05"/><rect y="3" width="3" height="3" fill="#fff" fill-opacity=".05"/>
</pattern>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
</linearGradient><pattern id="bk" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45) scale(1.1)"><rect x="0" y="0" width="120" height="120" fill="#2F3D6B"/><rect x="10" y="10" width="100" height="100" fill="#EFE8DA"/><rect x="20" y="20" width="80" height="80" fill="#2F3D6B"/><rect x="30" y="30" width="60" height="60" fill="#EFE8DA"/><rect x="40" y="40" width="40" height="40" fill="#2F3D6B"/><rect x="50" y="50" width="20" height="20" fill="#EFE8DA"/></pattern></defs><rect width="1600" height="1000" fill="url(#bk)"/><rect width="1600" height="1000" fill="url(#weave)"/><rect width="1600" height="1000" fill="url(#light)"/></svg>
