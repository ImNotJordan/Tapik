<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tutoring chat app with a lesson plan">
<title>Tutoring chat app with a lesson plan</title>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#F5F7FC" /><rect x="0" y="0" width="820" height="800" rx="0" fill="#FFFFFF" /><rect x="820" y="0" width="1" height="800" rx="0" fill="#E2E7F1" /><rect x="32" y="28" width="40" height="40" rx="12" fill="#3D6BF2" /><text x="86" y="56" font-size="21" font-weight="700" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Aral Buddy</text><text x="640" y="56" font-size="15" font-weight="500" fill="#6B768A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Grade 9 · Math</text><rect x="0" y="92" width="820" height="1" rx="0" fill="#E2E7F1" /><rect x="310" y="128" width="470" height="88" rx="20" fill="#3D6BF2" /><text x="334" y="168" font-size="19" font-weight="500" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Paano ko i-solve ang quadratic</text><text x="334" y="198" font-size="19" font-weight="500" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >equation na ito? x² − 5x + 6 = 0</text><rect x="40" y="238" width="470" height="118" rx="20" fill="#E4EAFD" /><text x="64" y="278" font-size="19" font-weight="500" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Hanapin natin ang dalawang numero</text><text x="64" y="308" font-size="19" font-weight="500" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >na ang product ay 6 at sum ay −5.</text><text x="64" y="338" font-size="19" font-weight="500" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Subukan mo: −2 at −3?</text><rect x="310" y="378" width="470" height="58" rx="20" fill="#3D6BF2" /><text x="334" y="418" font-size="19" font-weight="500" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >So (x − 2)(x − 3) = 0?</text><rect x="40" y="458" width="470" height="88" rx="20" fill="#E4EAFD" /><text x="64" y="498" font-size="19" font-weight="500" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Tama! Kaya x = 2 o x = 3.</text><text x="64" y="528" font-size="19" font-weight="500" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Gusto mo ng 3 practice items?</text><rect x="40" y="700" width="740" height="64" rx="32" fill="#F5F7FC" stroke="#E2E7F1" stroke-width="2"/><text x="72" y="740" font-size="18" font-weight="500" fill="#6B768A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Magtanong…</text><circle cx="744" cy="732" r="22" fill="#3D6BF2" /><text x="856" y="64" font-size="22" font-weight="700" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Lesson plan</text><rect x="856" y="100" width="388" height="80" rx="16" fill="#E4EAFD" stroke="#E2E7F1" stroke-width="2"/><circle cx="890" cy="140" r="12" fill="#3D6BF2" /><text x="918" y="147" font-size="18" font-weight="600" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Factoring basics</text><rect x="856" y="196" width="388" height="80" rx="16" fill="#E4EAFD" stroke="#E2E7F1" stroke-width="2"/><circle cx="890" cy="236" r="12" fill="#3D6BF2" /><text x="918" y="243" font-size="18" font-weight="600" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Sum and product</text><rect x="856" y="292" width="388" height="80" rx="16" fill="#FFFFFF" stroke="#E2E7F1" stroke-width="2"/><circle cx="890" cy="332" r="12" fill="#E2E7F1" /><text x="918" y="339" font-size="18" font-weight="600" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Practice: 3 items</text><rect x="856" y="388" width="388" height="80" rx="16" fill="#FFFFFF" stroke="#E2E7F1" stroke-width="2"/><circle cx="890" cy="428" r="12" fill="#E2E7F1" /><text x="918" y="435" font-size="18" font-weight="600" fill="#1B2433" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >Quick quiz</text><rect x="856" y="500" width="388" height="120" rx="16" fill="#FFFFFF" stroke="#E2E7F1" stroke-width="2"/><text x="880" y="542" font-size="16" font-weight="500" fill="#6B768A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" >This week</text><rect x="880" y="570" width="340" height="14" rx="7" fill="#E2E7F1" /><rect x="880" y="570" width="236" height="14" rx="7" fill="#3D6BF2" />
</svg>
